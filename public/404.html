<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Page Not Found</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<style>
		:root {
			--primary-color: #000;
			--secondary-color: #c41e3d;
		}
		* {
			box-sizing: border-box;
			margin: 0;
		}
		html {
			height: 100dvh;
			background: var(--primary-color);
			background: linear-gradient(
				var(--secondary-color) 0 60%,
				var(--primary-color) 0 100%
			);
		}
		body {
			height: 100%;
			padding: 48px;
			display: flex;

			align-items: center;
			justify-content: center;

			font-family: "Poppins", sans-serif;
			color: #686963;
		}
		#box {
			height: 300px;
			width: 480px;
			background: #fafafa;
			padding: 24px;
			border-radius: 100px;
			box-shadow: 0 0 0 14px var(--secondary-color);
			border: 14px solid var(--primary-color);
			transform: rotate3d(1, 1, 1, 340deg);

			display: flex;
			flex-direction: column;
			justify-content: center;
			text-align: center;
		}
		#box h1 {
			font-size: 94px;
			font-weight: 800;
			font-style: italic;
			color: #000;
		}
		#box h3 {
			font-family: "Inter", sans-serif;
		}
		#home {
			position: absolute;
			bottom: 16px;
		}
		#home a {
			color: #fff;
			text-decoration: underline;
		}
		#home a:hover {
			color: #000;
		}
	</style>
	<body>
		<div id="box">
			<h1>404</h1>
			<h3>Oops! This page doesn't exist.</h3>
		</div>
		<p id="home"><a href="/">Go back to homepage</a></p>
	</body>
</html>
